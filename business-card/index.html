<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Houston Comedy Club - Premium Business Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&family=Inter:wght@300;400;700&family=Playfair+Display:ital@1&display=swap">
</head>
<body>

    <div class="business-card">
        <div class="border-box">
            
            <!-- Branding Area (Left) -->
            <div class="logo-area">
                <img src="images/logo-stacked.svg" alt="Branding" class="logo-main">
            </div>

            <!-- Content Area (Right) -->
            <div class="data-area">
                
                <div class="website-heading">thehoustoncomedyclub.com</div>

                <div class="contact-row">
                    <span class="tag">Inquiries</span>
                    <span class="info-text">info@thehoustoncomedyclub.com</span>
                </div>

                <div class="contact-row">
                    <span class="tag">Bookings</span>
                    <span class="info-text">bookings@thehoustoncomedyclub.com</span>
                </div>

                <div class="footer-block">
                    <div class="detail">
                        <span class="tag">Phone</span>
                        <span class="info-text highlight">281.797.1396</span>
                    </div>
                    <div class="detail" style="text-align: right;">
                        <span class="tag">Address</span>
                        <span class="info-text highlight">2020 Waugh Dr<br>Houston, TX</span>
                    </div>
                </div>

            </div>

        </div>
    </div>

</body>
</html>
