<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Houston Comedy Club - Business Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&family=Inter:wght@300;400&family=Playfair+Display:ital@1&display=swap">
</head>
<body>

    <div class="business-card">
        <div class="card-face">
            <!-- Branding -->
            <div class="branding-header">
                <img src="images/logo-stacked.svg" alt="Logo" class="main-logo-centered">
            </div>

            <div class="white-divider"></div>

            <!-- Contact Information -->
            <div class="contact-details-centered">
                <div class="contact-row-centered">
                    <span class="label">Email:</span>
                    <span class="value">rudzmgmt@hotmail.com</span>
                </div>

                <div class="contact-row-centered">
                    <span class="label">Phone:</span>
                    <span class="value">281-797-1396</span>
                </div>

                <div class="contact-row-centered">
                    <span class="label">Address:</span>
                    <span class="value">2010 Waugh Dr, Houston, Texas 77006</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
